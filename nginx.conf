server {
    listen 80;
    server_name stlukehospitalcalabar.com www.stlukehospitalcalabar.com;
    return 301 https://stlukehospitalcalabar.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stlukehospitalcalabar.com;
    ssl_certificate     /etc/ssl/stluke/stlukehospitalcalabar.com.crt;
    ssl_certificate_key /etc/ssl/stluke/stlukehospitalcalabar.com.key;
    return 301 https://stlukehospitalcalabar.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stlukehospitalcalabar.com;

    ssl_certificate     /etc/ssl/stluke/stlukehospitalcalabar.com.crt;
    ssl_certificate_key /etc/ssl/stluke/stlukehospitalcalabar.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/stlukehospital;
    index index.html;

    # ── Security headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:;" always;

    # ── Main routing ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # ── Custom 404 ────────────────────────────────────────────
    error_page 404 /404.html;

    # ── Cache static assets ───────────────────────────────────
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Block hidden files ────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── SEO files ─────────────────────────────────────────────
    location = /robots.txt  { log_not_found off; access_log off; }
    location = /favicon.ico { log_not_found off; access_log off; }

    access_log /var/log/nginx/stluke-access.log;
    error_log  /var/log/nginx/stluke-error.log;
}
